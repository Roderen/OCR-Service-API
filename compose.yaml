services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OCR_LANG: en
    volumes:
      - paddle_models:/home/appuser/.paddlex
      - ./ocr-service/logs:/home/appuser/logs
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 4g

  task-manager-api:
    image: task-manager-api
    build:
      context: .
      dockerfile: Task-Manager-API/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - ocr-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=taskmanager;Username=${DB_USERNAME};Password=${DB_PASSWORD}"
      OcrService__Url: http://ocr-service:8000
      OCR_INTERNAL_TOKEN: ${OCR_INTERNAL_TOKEN}

volumes:
  postgres_data:
  paddle_models: